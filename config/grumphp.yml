grumphp:
    hooks_dir: ~
    tasks:
        git_commit_message:
            allow_empty_message: false
            enforce_capitalized_subject: false
            enforce_no_subject_punctuations: false
            enforce_no_subject_trailing_period: true
            enforce_single_lined_subject: true
            type_scope_conventions: []
            max_body_width: 72
            max_subject_width: 60
            matchers:
                "Debe contener un número de issue": '/^\[#\d+\] - .+$/'

            case_insensitive: true
            multiline: true
            additional_modifiers: ''

        git_branch_name:
            whitelist:
                - '/^\d+-[a-zA-Z0-9-]+$/'
            blacklist:
                - "main"
                - "master"
                - "develop"
            allow_detached_head: true

        phpcs:
            standard: PSR12
            whitelist_patterns:
                - "/src/"
            triggered_by: ["php"]

        phpmd:
            ruleset:
                - "cleancode"
                - "codesize"
                - "naming"
                - "phpmd.xml"
            exclude:
                - "vendor"
                - "StaticAccess"

        composer:
            file: "composer.json"
